[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpcms-compliance"
version = "0.1.0"
description = "RPCMS partner compliance checks (URSB, NGO Bureau, AMP) and quarterly AMP/NIMES submissions, mock clients only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "pydantic>=2.5", "pydantic-settings>=2.2", "pyjwt>=2.8", "sqlalchemy>=2.0", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rpcms-compliance-worker = "rpcms_compliance.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rpcms_compliance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
